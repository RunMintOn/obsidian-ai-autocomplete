name: Build

on:
  push:
    branches:
      - main
      - feat/inline-completion-v2
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare Obsidian plugin artifact
        run: |
          mkdir -p dist/ai-autocomplete
          cp main.js manifest.json styles.css dist/ai-autocomplete/
      - uses: actions/upload-artifact@v4
        with:
          name: ai-autocomplete-dev
          path: dist/ai-autocomplete
